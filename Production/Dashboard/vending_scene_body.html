<section class="vending-storyboard" aria-label="Кадры в монтажном порядке"><figure class="vending-shot" id="shot-01"><a href="frames/01.png"><img src="previews/01.webp?v=3afe61191ddb" alt="Подход" width="1916" height="821" fetchpriority="high"></a><figcaption><p class="mono vending-shot-meta">01 · Низкий общий · 28 мм</p><h2>Подход</h2><p>Автомат задаёт левый край. Эмма входит справа, Таис у выдачи.</p></figcaption></figure><figure class="vending-shot" id="shot-02"><a href="frames/02.png"><img src="previews/02.webp" alt="Батончик в лотке" width="1915" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">02 · Предметная вставка · 70 мм</p><h2>Батончик в лотке</h2><p>Упаковка ложится на край лотка, рядом появляется рюкзак.</p></figcaption></figure><figure class="vending-shot" id="shot-03"><a href="frames/03.png"><img src="previews/03.webp" alt="Взгляд Эммы" width="1916" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">03 · Крупный · 85 мм</p><h2>Взгляд Эммы</h2><p>Улыбка гаснет, глаза уходят вниз и влево.</p></figcaption></figure><figure class="vending-shot" id="shot-04"><a href="frames/04.png"><img src="previews/04.webp" alt="Пыль на ботинках" width="1915" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">04 · Точка зрения Эммы · 65 мм</p><h2>Пыль на ботинках</h2><p>Зритель видит причину её настороженности.</p></figcaption></figure><figure class="vending-shot" id="shot-05"><a href="frames/05.png"><img src="previews/05.webp?v=22ef3e0a5287" alt="Таис замечает взгляд" width="1916" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">05 · Крупный через плечо · 85 мм</p><h2>Таис замечает взгляд</h2><p>Таис смотрит вправо и на секунду замирает.</p></figcaption></figure><figure class="vending-shot" id="shot-06"><a href="frames/06.png"><img src="previews/06.webp" alt="Ответный взгляд Эммы" width="1916" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">06 · Встречный крупный · 90 мм</p><h2>Ответный взгляд Эммы</h2><p>Эмма смотрит влево. Теперь она проверяет догадку.</p></figcaption></figure><figure class="vending-shot" id="shot-07"><a href="frames/07.png"><img src="previews/07.webp?v=0c5fe9495364" alt="Эмма зовёт Дона" width="1915" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">07 · Средне-общий · 40 мм</p><h2>Эмма зовёт Дона</h2><p>Поворот Эммы к правому концу прохода виден в кадре.</p></figcaption></figure><figure class="vending-shot" id="shot-08"><a href="frames/08.png"><img src="previews/08.webp" alt="Дон реагирует" width="1916" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">08 · Крупный · 85 мм</p><h2>Дон реагирует</h2><p>Дон переводит взгляд влево и остаётся на посту.</p></figcaption></figure><figure class="vending-shot" id="shot-09"><a href="frames/09.png"><img src="previews/09.webp?v=7f725627ef1d" alt="Таис уходит" width="1916" height="821" loading="lazy"></a><figcaption><p class="mono vending-shot-meta">09 · Общий · 55 мм</p><h2>Таис уходит</h2><p>Таис уходит вправо. Эмма остаётся у автомата.</p></figcaption></figure></section>
