<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1030 350" role="img" aria-labelledby="title desc">
<title id="title">Знаки отделения операторов</title>
<desc id="desc">В адаптации число звёзд обозначает ступень внутри отделения. Оно одинаково на каждом погоне, каждом шевроне и в голограмме. Три звезды — знак капитана отделения, который носит Эмма.</desc>
