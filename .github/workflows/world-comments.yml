name: Update World comments
on:
  discussion_comment:
    types: [created, edited, deleted]
  discussion:
    types: [created, edited, deleted, category_changed]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'
permissions:
  contents: write
  discussions: read
concurrency:
  group: world-comments-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: codex/alive-roadmap-site
          persist-credentials: false
          sparse-checkout: |
            scripts/sync_world_comments.py
            Production/Dashboard/comments.json
            docs/World/comment-pages.json
          sparse-checkout-cone-mode: false
      - name: Refresh public read-only feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/sync_world_comments.py --publish
